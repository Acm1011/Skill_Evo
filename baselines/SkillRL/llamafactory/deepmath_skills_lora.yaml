# Copy or symlink this file under LLaMA-Factory and run from LLaMA-Factory root:
#   llamafactory-cli train path/to/deepmath_skills_lora.yaml
# Prerequisites:
#   1) Place deepmath_skills_sft.json in LLaMA-Factory/data/
#   2) Merge llamafactory/dataset_info.snippet.json into data/dataset_info.json (key: deepmath_skills_sft)
#
# Override paths via environment variables in run_sft_llamafactory.sh (sed) or edit below.

model_name_or_path: Qwen/Qwen2.5-7B-Instruct
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_target: all

dataset: deepmath_skills_sft
template: qwen
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 8

output_dir: saves/deepmath_skills_lora
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: false

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

val_size: 0.05
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200
